name: Radar — diagnóstico fontes externas
on:
  push:
    paths:
      - '.github/workflows/radar-fontes-diagnostico.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Testar 24 Notícias e feeds públicos
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,re,html,xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlsplit,quote
          urls=[
            "https://24noticias.sapo.pt/robots.txt",
            "https://24noticias.sapo.pt/",
            "https://24noticias.sapo.pt/ultimas",
            "https://24noticias.sapo.pt/rss",
            "https://24noticias.sapo.pt/feed",
            "https://sitemaps.sapo.pt/sitemaps/24pt/sitemapindex-24pt.xml",
            "https://news.google.com/rss/search?q="+quote("site:ojogo.pt when:1d")+"&hl=pt-PT&gl=PT&ceid=PT:pt",
            "https://freenewsapi.ai/v1/rss?host=24noticias.sapo.pt&size=5",
            "https://freenewsapi.ai/v1/rss?host=www.ojogo.pt&size=5"
          ]
          class L(HTMLParser):
            def __init__(self,base):super().__init__();self.base=base;self.links=[];self.record=None
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='a' and a.get('href'):self.record=[urljoin(self.base,a['href']),[]]
            def handle_data(self,txt):
              if self.record:self.record[1].append(txt)
            def handle_endtag(self,tag):
              if tag=='a' and self.record:
                url,words=self.record;self.record=None
                title=' '.join(words).strip()
                if title and url.startswith('http'):self.links.append((url,title[:75]))
          for url in urls:
            print("### URL",url,flush=True)
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"RadarNoticias/1.1 (+personal RSS reader)","Accept":"text/html,application/xml,application/rss+xml;q=0.9,*/*;q=0.7"}),timeout=13) as f:
                raw=f.read(350000);status=f.status;resurl=f.url;ctype=f.headers.get('Content-Type')
              page=raw.decode('utf-8','replace')
              print("RESULT",status,ctype,len(raw),resurl,flush=True)
              if 'robots.txt' in url:print("ROBOTS",page[:2200].replace('\n',' | '),flush=True)
              elif '<html' in page[:400].lower() or 'text/html' in (ctype or ''):
                a=L(url);a.feed(page)
                print("LINKS",len(a.links),flush=True)
                for link,title in a.links[:65]:
                  if 'sapo.pt' in link or 'ojogo.pt' in link:print("ARTICLE",link,"TITLE",title,flush=True)
                for k in ['article:published_time','datePublished','og:image','application/ld+json','<time','_next','__NEXT_DATA__','/api/','https://24noticias.sapo.pt/']:
                  print("COUNT",k,page.lower().count(k.lower()),flush=True)
                print("SAMPLE",re.sub(r'\s+',' ',page[:1000]),flush=True)
              else:
                print("SAMPLE",re.sub(r'\s+',' ',page[:1150]),flush=True)
                try:
                  tree=ET.fromstring(raw)
                  articles=[n for n in tree.iter() if n.tag.split('}')[-1].lower() in ('item','url','entry')]
                  print("XMLITEMS",len(articles),flush=True)
                  for item in articles[:4]:print("XMLART",''.join(item.itertext())[:400].replace('\n',' '),flush=True)
                except Exception as ex:print("XMLERROR",str(ex)[:120],flush=True)
            except Exception as ex:print("ERROR",repr(ex)[:300],flush=True)
          PY
