name: Radar — diagnóstico novos feeds
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/radar-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Verificar 14 fontes e RSS
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, concurrent.futures, xml.etree.ElementTree as ET, re, html, json, time
          from html.parser import HTMLParser
          sites=[
            ('TNT Sports','https://www.tntsports.co.uk/',['https://www.tntsports.co.uk/rss.xml','https://www.tntsports.co.uk/feed/']),
            ('OneFootball','https://onefootball.com/en/home',['https://onefootball.com/en/rss','https://onefootball.com/feed/']),
            ('BBC Sport','https://www.bbc.com/sport',['https://feeds.bbci.co.uk/sport/rss.xml']),
            ('TopCycling','https://www.topcycling.pt/',['https://www.topcycling.pt/feed/','https://topcycling.pt/feed/']),
            ('Cyclingnews','https://www.cyclingnews.com/',['https://www.cyclingnews.com/rss/','https://www.cyclingnews.com/feeds.xml','https://www.cyclingnews.com/feed/']),
            ('Cycling Weekly','https://www.cyclingweekly.com/',['https://www.cyclingweekly.com/feed/','https://www.cyclingweekly.com/rss/','https://www.cyclingweekly.com/feeds.xml']),
            ('Velo','https://velo.outsideonline.com/',['https://velo.outsideonline.com/feed/','https://velo.outsideonline.com/feed/rss/']),
            ('Raquetc','https://www.raquetc.com/',['https://www.raquetc.com/feed/','https://raquetc.com/feed/']),
            ('Tennis365','https://www.tennis365.com/',['https://www.tennis365.com/feed/','https://www.tennis365.com/rss/']),
            ('FutsalPlanet','https://www.futsalplanet.com/default.aspx',['https://www.futsalplanet.com/rss.xml','https://www.futsalplanet.com/feed/']),
            ('F1PT','https://www.f1pt.pt/',['https://www.f1pt.pt/feed/','https://f1pt.pt/feed/']),
            ('PlanetF1','https://www.planetf1.com/',['https://www.planetf1.com/feed/','https://www.planetf1.com/rss/']),
            ('The Race','https://www.the-race.com/',['https://www.the-race.com/feed/','https://www.the-race.com/rss/']),
            ('HóqueiPT','https://hoqueipt.com/',['https://hoqueipt.com/feed/','https://www.hoqueipt.com/feed/'])
          ]
          class Links(HTMLParser):
            def __init__(self,url):super().__init__();self.url=url;self.feeds=[]
            def handle_starttag(self,tag,attrs):
              if tag!='link':return
              a=dict(attrs)
              if 'rss' in a.get('type','').lower() or 'atom' in a.get('type','').lower():
                u=urllib.parse.urljoin(self.url,a.get('href',''))
                if u.startswith(('http://','https://')):self.feeds.append(u)
          def get(url):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'RadarNoticias/1.2 (personal news reader)','Accept':'application/rss+xml,application/atom+xml,text/xml,application/xml,text/html;q=0.8,*/*;q=0.5'})
              with urllib.request.urlopen(req,timeout=12) as res:
                data=res.read(260000)
                ctype=res.headers.get('Content-Type','')
                real=res.url
              r={'status':200,'len':len(data),'final':real,'type':ctype}
              try:
                root=ET.fromstring(data)
                r['xmlroot']=root.tag.rsplit('}',1)[-1]
                r['items']=sum(1 for n in root.iter() if n.tag.rsplit('}',1)[-1] in ('item','entry'))
                r['titles']=[''.join(n.itertext())[:65] for n in root.iter() if n.tag.rsplit('}',1)[-1]=='title'][:3]
              except Exception:
                page=data.decode('utf-8','replace')
                p=Links(real);p.feed(page);r['feeds']=p.feeds[:6]
                r['links']=len(re.findall(r'<a\\s',page,re.I))
                r['dates']=len(re.findall(r'(?:datePublished|article:published_time|datetime)',page,re.I))
              return r
            except Exception as e:return {'err':str(e)[:120]}
          def check(site):
            name,home,known=site
            work=[('HOME',home),('ROBOTS',urllib.parse.urljoin(home,'/robots.txt'))]+[('RSS',u) for u in known]
            with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              values=list(pool.map(lambda x:get(x[1]),work))
            out={'name':name,'checks':[dict(role=w[0],url=w[1],**v) for w,v in zip(work,values)]}
            return out
          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as pool:
            for out in pool.map(check,sites):
              print('RADAR_PROBE '+json.dumps(out,ensure_ascii=False),flush=True)
          PY
