name: Diagnóstico temporário de fontes
on:
  push:
    paths:
      - .github/workflows/diagnostico-fontes.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verificar HTML público e ligações a notícias
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlsplit
          import html,re
          targets={
            "bolamarela":["https://bolamarela.pt/","https://bolamarela.pt/noticias/"],
            "blitz":["https://expresso.pt/blitz","https://expresso.pt/sitemap/news.xml"],
            "futsalportugal":["https://futsalportugal.com/pt/noticias"],
            "record":["https://www.record.pt/ultimas-noticias","https://www.record.pt/rss/"],
            "fcporto":["https://www.fcporto.pt/pt/noticias"],
            "afatv":["https://afatv.pt/news"],
          }
          class Links(HTMLParser):
            def __init__(self,base):super().__init__();self.base=base;self.links=[];self.anchor=None
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=="a" and a.get("href"):
                self.anchor=[urljoin(self.base,a["href"]),[]]
            def handle_data(self,data):
              if self.anchor:self.anchor[1].append(data.strip())
            def handle_endtag(self,tag):
              if tag=="a" and self.anchor:
                url,words=self.anchor;self.anchor=None
                name=" ".join(w for w in words if w).strip()
                if len(name)>18 and url.startswith("http"):
                  self.links.append((url,name[:85]))
          for name,urls in targets.items():
            print("\\n###",name,flush=True)
            for url in urls:
              try:
                req=Request(url,headers={"User-Agent":"RadarNoticias/1.1 (news feed reader; personal use)","Accept":"text/html,application/xml,application/rss+xml;q=0.9"})
                with urlopen(req,timeout=16) as response:
                  raw=response.read(900000).decode(response.headers.get_content_charset() or "utf-8","replace")
                  print("PAGE",response.status,response.url,len(raw),response.headers.get("Content-Type"),flush=True)
                types=re.findall(r'<meta[^>]+(?:article:published_time|datePublished|pubdate|date)[^>]{0,300}>',raw,re.I)
                print("META",types[:2],flush=True)
                if raw.lstrip().startswith("<?xml"):
                  print("XML sample",re.sub(r'\\s+',' ',raw[:350]),flush=True)
                else:
                  parser=Links(url);parser.feed(raw)
                  print("LINKS",len(parser.links),flush=True)
                  for link,title in parser.links[:25]:
                    print("LINK",link,"TITLE",title,flush=True)
              except Exception as ex:print("ERROR",url,str(ex)[:270],flush=True)
          PY
